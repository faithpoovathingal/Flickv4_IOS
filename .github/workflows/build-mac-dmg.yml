name: Build macOS DMG
on: workflow_dispatch

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure Xcode Node Environment & TMDB Keys
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          cat << 'EOF' > .env
          EXPO_PUBLIC_TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          EXPO_PUBLIC_TMDB_BASE_URL=https://api.themoviedb.org/3
          EXPO_PUBLIC_TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxMDExNmZhMzAyYzhmZTBjMmNiYzM4YmUxN2FhNjVhNSIsIm5iZiI6MTc4NzE0MjkzMy4wNiwic3ViamVjdCI6IjZkNWEzMTU0NmQzN2ZlMzYxNjc0NDEzIiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.nHY8A-KhX4-MefoFpq7Wy32K5EVdn9uTsYkCfkcCi_I
          EXPO_PUBLIC_WYZIE_BASE_URL=https://sub.wyzie.io
          EXPO_PUBLIC_WYZIE_API_KEY=
          EXPO_PUBLIC_SAMPLE_VIDEO_URL=https://media.w3.org/2010/05/sintel/trailer.mp4
          EXPO_PUBLIC_WATCH_PARTY_URL=
          TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          APP_VERSION=2.3.2
          ANDROID_VERSION_CODE=20302
          EOF

          node -e '
            const fs = require("fs");
            const file = "src/config/env.ts";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_API_KEY(\s*\|\|\s*["\x27"].*?["\x27"])?/g, "\"10116fa302c8fe0c2cbc38be17aa65a5\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_BASE_URL(\s*\|\|\s*["\x27"].*?["\x27"])?/g, "\"https://api.themoviedb.org/3\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_IMAGE_BASE_URL(\s*\|\|\s*["\x27"].*?["\x27"])?/g, "\"https://image.tmdb.org/t/p/w500\"");
              fs.writeFileSync(file, content, "utf8");
            }
          '

      - name: Enable Apple Silicon Mac Execution in Project
        run: |
          sed -i '' 's/SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = NO;/SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = YES;/g' ios/Flick.xcodeproj/project.pbxproj

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          rm -f Podfile.lock
          if ! grep -q "pod 'MMKV', '2.3.0'" Podfile; then
            sed -i '' '/target '\''Flick'\'' do/a\
              pod '\''MMKV'\'', '\''2.3.0'\''\
              pod '\''MMKVCore'\'', '\''2.3.0'\''
            ' Podfile
          fi
          pod install --repo-update

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild -workspace Flick.xcworkspace \
            -scheme Flick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flick.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            archive

      - name: Package Mac DMG
        run: |
          cd ios
          mkdir -p dmg_root
          cp -R build/Flick.xcarchive/Products/Applications/Flick.app dmg_root/Flick.app
          
          # Patch bundle metadata to remove iPhone-only restriction and allow Apple Silicon execution
          /usr/libexec/PlistBuddy -c "Set :LSRequiresIPhoneOS false" dmg_root/Flick.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool false" dmg_root/Flick.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" dmg_root/Flick.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" dmg_root/Flick.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" dmg_root/Flick.app/Info.plist 2>/dev/null || true

          # Strip quarantine metadata and ad-hoc sign bundle
          xattr -cr dmg_root/Flick.app
          codesign --force --deep --sign - dmg_root/Flick.app

          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Flick v2.3.2" -srcfolder dmg_root -ov -format UDZO Flickv4-2.3.2-Mac.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flickv4-Mac-DMG
          path: ios/Flickv4-2.3.2-Mac.dmg
